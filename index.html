<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>音乐灵感三步筛选器</title>

  <!-- 经典衬线 + 细无衬线：标题 Playfair Display / Noto Serif SC，正文 Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Noto+Serif+SC:wght@300;400;500;600;700&family=Inter:wght@300;400;500&display=swap"
    rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- 背景纹理（纯装饰，重复排列的细线图案） -->
  <div class="bg-pattern" aria-hidden="true"></div>

  <header class="topbar">
    <button id="back-btn" class="back-btn" title="返回并重置到第一步">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"
        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M19 12H5" />
        <path d="m12 19-7-7 7-7" />
      </svg>
      <span>返回</span>
    </button>

    <div class="brand">
      <span class="brand-eyebrow">Music Inspiration — Three Steps</span>
      <h1 class="app-title">音乐灵感三步筛选器</h1>
    </div>

    <span class="topbar-spacer" aria-hidden="true"></span>
  </header>

  <nav class="stepper" id="stepper">
    <div class="step" data-step="1">
      <span class="step-num">I</span>
      <span class="step-label">选风格</span>
    </div>
    <div class="step-sep" aria-hidden="true"></div>
    <div class="step" data-step="2">
      <span class="step-num">II</span>
      <span class="step-label">选主题</span>
    </div>
    <div class="step-sep" aria-hidden="true"></div>
    <div class="step" data-step="3">
      <span class="step-num">III</span>
      <span class="step-label">看故事</span>
    </div>
  </nav>

  <main id="step-content" class="step-content"><!-- 由 app.js 渲染 --></main>

  <footer class="footer" aria-hidden="true">
    <div class="footer-rule"></div>
    <div class="footer-icons">
      <!-- 单色线条简笔图标：音符 / 咖啡杯 / 酒杯 / 唱片 -->
      <svg class="icon-line" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 18V5l12-2v13" /><circle cx="6" cy="18" r="3" /><circle cx="18" cy="16" r="3" />
      </svg>
      <svg class="icon-line" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="M17 8h1a4 4 0 1 1 0 8h-1" /><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z" />
        <path d="M6 2v2" /><path d="M10 2v2" /><path d="M14 2v2" />
      </svg>
      <svg class="icon-line" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 22h8" /><path d="M12 15v7" /><path d="M12 15a6 6 0 0 0 6-6V3H6v6a6 6 0 0 0 6 6Z" />
      </svg>
      <svg class="icon-line" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"
        stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10" /><circle cx="12" cy="12" r="2.5" />
        <path d="M12 2a10 10 0 0 0 0 20" opacity=".6" />
      </svg>
    </div>
    <div class="footer-rule"></div>
  </footer>

  <div id="toast" class="toast">复制成功！</div>

  <!-- 本地 AI 配置：本机文件，不提交代码仓库 -->
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
